    const searchInput = document.getElementById('searchInput');

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function fmtWon(n) {
      return Number(n || 0).toLocaleString('ko-KR') + '원';
    }

    function timeLabel(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${mm}/${dd} ${hh}:${mi} 등록`;
    }

    function render() {
      const q = (searchInput.value || '').trim().toLowerCase();
      const list = DEALS.filter(item => {
        if (q && !(item.displayName || '').toLowerCase().includes(q)) return false;
        if (currentFilter === 'lowest') return Boolean(item.isLowestPrice30d);
        if (currentFilter === 'today') return item.source === 'today-deals';
        if (currentFilter === 'naver') return item.mall === 'naver';
        if (currentFilter === 'musinsa') return item.mall === 'musinsa';
        return true;
      });

      if (list.length === 0) {
        grid.innerHTML = '<div class="empty">현재 조건에 맞는 특가 상품이 없습니다.<br/>곧 다음 타임 특가가 자동 업데이트됩니다 🔥</div>';
        return;
      }

      grid.innerHTML = list.map(item => {
        const mallName = item.mall === 'naver' ? '네이버' : (item.mall === 'musinsa' ? '무신사' : '토스쇼핑');
        const badges = [
          `<span class="badge mall">${mallName}</span>`,
          item.source === 'today-deals' ? '<span class="badge hot">하루특가</span>' : '',
          item.isLowestPrice30d ? '<span class="badge lowest">30일 최저가</span>' : ''
        ].filter(Boolean).join('');

        const origHtml = item.originalPrice > item.displayPrice
          ? `<span class="orig">${fmtWon(item.originalPrice)}</span>` : '';
        const discHtml = item.discountRate > 0
          ? `<span class="discount">${item.discountRate}%</span>` : '';
        const reviewHtml = item.reviewCount > 0
          ? `★ ${Number(item.reviewScore).toFixed(1)} (리뷰 ${Number(item.reviewCount).toLocaleString('ko-KR')}개) · ` : '';
        const imgTag = item.thumbnailUrl
          ? `<img class="thumb" src="${esc(item.thumbnailUrl)}" alt="${esc(item.displayName)}" loading="lazy" />`
          : `<div class="thumb"></div>`;

        return `
          <article class="card">
            ${imgTag}
            <div class="info">
              <div>
                <div class="badges">${badges}</div>
                <div class="name">${esc(item.displayName)}</div>
                <div class="price-row">
                  ${discHtml}
                  <span class="sale">${fmtWon(item.displayPrice)}</span>
                  ${origHtml}
                </div>
                <div class="meta">${reviewHtml}${timeLabel(item.createdAt)}</div>
              </div>
              <a class="buy-btn" href="${esc(item.shortUrl)}" target="_blank" rel="noopener">🛒 최저가 바로가기</a>
            </div>
          </article>
        `;
      }).join('');
    }

    document.getElementById('filterTabs').addEventListener('click', e => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
    searchInput.addEventListener('input', render);
    render();
  </script>
</body>
</html>
